<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="WDD 131 – Dynamic Web Fundamentals temples page example using semantic HTML elements, CSS and JS.">
    <meta name="author" content="Luiz MR Lemos">
    <meta name="keywords" content="WDD 131, Dynamic Web Fundamentals, HTML, CSS, JavaScript">
    <title>WDD 131 – Temple Album - Luiz MR Lemos</title>
    <link rel="stylesheet" href="styles/filtered-temples.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400&display=swap" rel="stylesheet">
    <script src="scripts/filtered-temples-data.js" defer></script>
    <script src="scripts/filtered-temples-gallery.js" defer></script>
    <script src="scripts/filtered-temples.js" defer></script>
</head>

<body>

    <header>
        <span>Temple Album</span>
        <nav id="primary-nav">
            <a href="#home">Home</a>
            <a href="#old">Old</a>
            <a href="#new">New</a>
            <a href="#large">Large</a>
            <a href="#small">Small</a>
        </nav>
        <button id="menu" type="button" aria-label="Open menu" aria-expanded="false"
            aria-controls="primary-nav"></button>
    </header>
    <main>
        <div class="hero">
            <picture>
                <source srcset="images/temple-hero-large.webp" media="(min-width: 1024px)">
                <source srcset="images/temple-hero-medium.webp" media="(min-width: 600px)">
                <img loading="eager" src="images/temple-hero-small.webp" alt="Image representing temples" width="800" height="1080">
            </picture>
        </div>
        <h1 class="title">Home</h1>
        <div class="gallery">
        </div>
    </main>
    <footer>
        <p>©️<span id="currentyear"></span> 😊 Luiz MR Lemos, Brazil</p>
        <p>Last modification: <span id="lastModified"></span></p>
    </footer>

</body>

</html>
