<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A basic page layout example using semantic HTML elements.">
    <meta name="author" content="Luiz MR Lemos">
    <title>Luiz MR Lemos WDD131 - Basic page Layout</title>
    <link rel="stylesheet" href="styles/layout.css">
</head>

<body>

    <header>
        <h1>Header Content</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Services</a></li>

        <h2>Footer Content</h2>
    </footer>

</html>
